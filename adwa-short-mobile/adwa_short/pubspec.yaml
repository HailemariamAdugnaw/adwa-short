name: adwa_short
description: ADWA SHORT — Premium short-drama streaming app
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  video_player: ^2.9.2
  chewie: ^1.17.2            # Updated: unblocks outdated background media plugins
  cached_network_image: ^4.0.4 # Updated: removes deprecated transitive gradle setups
  flutter_dotenv: ^6.0.1       # Updated
  google_fonts: ^9.0.0         # Updated
  shimmer: ^4.0.0              # Updated
  flutter_svg: ^2.0.10+1
  device_info_plus: ^13.3.0    # Updated: matches latest platform configurations
  uuid: ^4.4.0
  cupertino_icons: ^1.0.9      # Updated
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0        # Updated for structural consistency
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/