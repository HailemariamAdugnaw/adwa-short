# ─────────────────────────────────────────────────────────────
# ADWA SHORT Admin — Nginx config
# Serves the SPA bundle and proxies /api → backend.
# ─────────────────────────────────────────────────────────────

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Static assets — cache aggressively
  location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp4)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # API proxy → backend
  # Override BACKEND_URL via envsubst or nginx -e when needed
  location /api/ {
    proxy_pass http://adwa-backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Device-Id $http_x_device_id;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 200M;  # large uploads (video/poster)
  }

  location /uploads/ {
    proxy_pass http://adwa-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 200M;
  }
  # SPA fallback — everything else to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Disable favicon log spam
  location = /favicon.ico {
    log_not_found off;
    access_log off;
  }
}
